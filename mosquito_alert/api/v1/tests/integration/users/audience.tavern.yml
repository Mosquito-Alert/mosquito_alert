---

test_name: List users by audience (by in_area)

includes:
  - !include schema.yml

marks:
  - usefixtures:
    - api_live_url
    - app_user
    - jwt_token_user_can_view

stages:
  - name: Auth users can list users by audience with view perms. In area doesn't match the criteria
    request:
      url: "{api_live_url}/{endpoint}/audience/"
      method: "POST"
      headers:
        Authorization: "Bearer {jwt_token_user_can_view}"
      json:
        in_area:
          type: "Polygon"
          coordinates:
            -
              - [2.30, 48.80]
              - [2.40, 48.80]
              - [2.40, 48.90]
              - [2.30, 48.90]
              - [2.30, 48.80]
    response:
      status_code: 200
      strict:
        - json:off
      json:
        count: 0
        results: []

  - name: Auth users can list users by audience with view perms. In area matches the criteria
    request:
      url: "{api_live_url}/{endpoint}/audience/"
      method: "POST"
      headers:
        Authorization: "Bearer {jwt_token_user_can_view}"
      json:
        in_area:
          type: "Polygon"
          coordinates:
            -
              - [-3.80, 40.35]
              - [-3.60, 40.35]
              - [-3.60, 40.50]
              - [-3.80, 40.50]
              - [-3.80, 40.35]

    response:
      status_code: 200
      strict:
        - json:off
      json:
        count: 1
        results:
          - uuid: "{app_user.pk}"
            locale: "{app_user.locale}"
